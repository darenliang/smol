<style>
    a:active, a:hover, a:link, a:visited {
        color: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        transition: text-decoration-thickness .2s ease-out
    }

    a:hover {
        text-decoration-thickness: 2px
    }

    ::selection {
        background: #D4D4D4
    }

    p > code, pre {
        color: var(--precolor);
        background: var(--prebgcolor)
    }

    .center, img {
        display: block
    }

    figure, img {
        margin: auto
    }

    body, button, figcaption, input, textarea {
        font-family: 'Telegraf', sans-serif
    }

    h1, h2, h3, h4, h5, h6, nav, .display {
        font-family: 'Writer', serif
    }

    code, pre {
        font-family: 'Commit Mono', monospace;
    }

    footer {
        padding-top: 24px;
    }

    @font-face {
        font-display: swap;
        font-family: 'Writer';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/writer-latin-regular.woff2') format('woff2');
    }

    }

        font-style: normal;
        font-weight: 700;

    }

    @font-face {
        font-display: swap;

        font-style: italic;
        font-weight: 700;
        src: url('/fonts/writer-latin-bold-italic.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Telegraf';
        font-style: normal;
        font-weight: 200;
        src: url('/fonts/telegraf-latin-ultralight.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Telegraf';
        font-style: italic;
        font-weight: 200;
        src: url('/fonts/telegraf-latin-ultralight-italic.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Telegraf';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/telegraf-latin-regular.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Telegraf';
        font-style: italic;
        font-weight: 400;
        src: url('/fonts/telegraf-latin-regular-italic.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Telegraf';
        font-style: normal;
        font-weight: 800;
        src: url('/fonts/telegraf-latin-ultrabold.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Telegraf';
        font-style: italic;
        font-weight: 800;
        src: url('/fonts/telegraf-latin-ultrabold-italic.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Commit Mono';
        font-style: normal;
        font-weight: 400;
        src: url('/fonts/commit-mono-latin-regular.woff2') format('woff2');
    }

    @font-face {
        font-display: swap;
        font-family: 'Commit Mono';
        font-style: italic;
        font-weight: 400;
        src: url('/fonts/commit-mono-latin-regular-italic.woff2') format('woff2');
    }


    html {
        overflow-y: scroll;
        color-scheme: light dark;
        scrollbar-color: #C4C4C4 var(--bgcolor)
    }

    :root {
        --bgcolor: #FFF;
        --fontcolor: #333333;
        --mutedcolor: #666666;
        --precolor: #333333;
        --prebgcolor: #F7F7F7;
        --codebgcolor: #EBEBEB;
        --prebordercolor: #DCDCDC
    }

    body {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        font-size: 18px;
        line-height: 1.6;
        color: var(--fontcolor);
        background: var(--bgcolor)
    }

    h1 {
        font-size: 2.75rem;
        line-height: 1.15;
        font-weight: 700
    }

    h2 {
        font-size: 2rem;
        line-height: 1.25;
        font-weight: 700
    }

    h3 {
        font-size: 1.625rem;
        line-height: 1.3;
        font-weight: 600
    }

    h4 {
        font-size: 1.375rem;
        line-height: 1.35;
        font-weight: 600
    }

    h5 {
        font-size: 1.125rem;
        line-height: 1.4;
        font-weight: 700
    }

    h6 {
        font-size: 1rem;
        line-height: 1.4;
        font-weight: 700
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 2.125rem
        }

        h2 {
            font-size: 1.625rem
        }

        h3 {
            font-size: 1.375rem
        }

        h4 {
            font-size: 1.25rem
        }
    }

    :not(pre) > code {
        padding: 2px 4px;
        border-radius: 4px;
        background: var(--codebgcolor);
        font-size: .9em
    }

    pre {
        padding: 16px;
        overflow-x: auto;
        border: 1px solid var(--prebordercolor);
        border-radius: 6px
    }

    article {
        padding: 12px 0
    }

    .center {
        margin-left: auto;
        margin-right: auto;
        width: 100%
    }

    figcaption {
        color: var(--mutedcolor);
        text-align: center
    }

    blockquote {
        margin: 1.5em 0;
        padding-left: 24px;
        border-left: 2px solid var(--mutedcolor);
        color: var(--mutedcolor)
    }

    table:not(.lntable):not(.jss_worksheet) {
        border-collapse: collapse;
        margin: 1.5em 0;
        width: 100%
    }

    table:not(.lntable):not(.jss_worksheet) th,
    table:not(.lntable):not(.jss_worksheet) td {
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid var(--prebordercolor)
    }

    table:not(.lntable):not(.jss_worksheet) th {
        font-weight: 700;
        border-bottom: 2px solid var(--mutedcolor)
    }

    p {
        text-wrap: pretty
    }

    h1, h2, h3, h4, h5, h6 {
        text-wrap: balance
    }

    img {
        max-width: 100%;
        height: auto
    }

    button, input, textarea {
        margin: 3px 0
    }

    @media (prefers-color-scheme: dark) {
        ::selection {
            background: #4A4A4A
        }

        :root {
            --bgcolor: #111111;
            --fontcolor: #CCCCCC;
            --mutedcolor: #8A8A8A;
            --precolor: #CCCCCC;
            --prebgcolor: #1C1C1C;
            --codebgcolor: #2B2B2B;
            --prebordercolor: #2E2E2E
        }

        html {
            scrollbar-color: #3D3D3D var(--bgcolor)
        }

        button, input, textarea {
            border: 1px solid #ccc;
            background-color: #111111;
            color: #ccc
        }

        .boxed {
            padding: 0 10px;
            border: 1px solid #ccc
        }
    }

    @media (prefers-color-scheme: light) {
        button, input, textarea {
            border: 1px solid #333;
            background-color: #fff;
            color: #333
        }

        .boxed {
            padding: 0 10px;
            border: 1px solid #333
        }
    }

    div.highlight {
        font-size: 14px;
        line-height: 21px
    }

    div.highlight table pre {
        padding: 0
    }

    /* line-number table layout: one surface around the number and code columns */
    div.highlight > div.chroma {
        border: 1px solid var(--prebordercolor);
        border-radius: 6px;
        overflow-x: auto
    }

    div.highlight > div.chroma pre {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: none
    }

    div.highlight > div.chroma td {
        padding: 16px 0
    }

    div.highlight > div.chroma td:first-child {
        padding-left: 16px
    }

    div.highlight > div.chroma td:last-child {
        padding-right: 16px
    }

    /* GitHub code syntax palette (chroma "github") */
    .chroma {
        color: #1f2328;
        background-color: var(--prebgcolor);
        -webkit-text-size-adjust: none
    }

    .chroma .lnlinks {
        outline: none;
        text-decoration: none;
        color: inherit
    }

    .chroma .lntd {
        vertical-align: top;
        padding: 0;
        margin: 0;
        border: 0
    }

    .chroma .lntable {
        border-spacing: 0;
        padding: 0;
        margin: 0;
        border: 0
    }

    .chroma .line {
        display: flex
    }

    .chroma .hl {
        background-color: #dedede
    }

    .chroma .lnt, .chroma .ln {
        white-space: pre;
        -webkit-user-select: none;
        user-select: none;
        margin-right: .4em;
        padding: 0 .4em;
        color: #57606a
    }

    .chroma .k, .chroma .kc, .chroma .kd, .chroma .kn, .chroma .kp, .chroma .kr, .chroma .kt {
        color: #cf222e
    }

    .chroma .na, .chroma .nc, .chroma .nx, .chroma .p, .chroma .go {
        color: #1f2328
    }

    .chroma .no, .chroma .nd, .chroma .nt, .chroma .o, .chroma .ow, .chroma .or,
    .chroma .m, .chroma .mb, .chroma .mf, .chroma .mh, .chroma .mi, .chroma .il, .chroma .mo {
        color: #0550ae
    }

    .chroma .nn {
        color: #24292e
    }

    .chroma .nb, .chroma .ni, .chroma .nf, .chroma .fm {
        color: #6639ba
    }

    .chroma .nl {
        color: #900;
        font-weight: bold
    }

    .chroma .bp {
        color: #6a737d
    }

    .chroma .nv, .chroma .vc, .chroma .vg, .chroma .vi, .chroma .vm {
        color: #953800
    }

    .chroma .s, .chroma .sa, .chroma .sb, .chroma .sc, .chroma .dl, .chroma .sd,
    .chroma .s2, .chroma .se, .chroma .sh, .chroma .si, .chroma .sx, .chroma .sr, .chroma .s1 {
        color: #0a3069
    }

    .chroma .ss {
        color: #032f62
    }

    .chroma .c, .chroma .ch, .chroma .cm, .chroma .c1, .chroma .cs, .chroma .cp, .chroma .cpf {
        color: #57606a
    }

    .chroma .gd {
        color: #82071e;
        background-color: #ffebe9
    }

    .chroma .gi {
        color: #116329;
        background-color: #dafbe1
    }

    .chroma .ge {
        font-style: italic
    }

    .chroma .gs {
        font-weight: bold
    }

    .chroma .gl {
        text-decoration: underline
    }

    .chroma .w {
        color: #fff
    }

    /* GitHub code syntax palette (chroma "github-dark") */
    @media (prefers-color-scheme: dark) {
        .chroma {
            color: #e6edf3;
            background-color: var(--prebgcolor)
        }

        .chroma .hl {
            background-color: #6e7681
        }

        .chroma .lnt, .chroma .ln {
            color: #8b949e
        }

        .chroma .k, .chroma .kd, .chroma .kn, .chroma .kr, .chroma .kt,
        .chroma .nn, .chroma .o, .chroma .ow, .chroma .or {
            color: #ff7b72
        }

        .chroma .kc, .chroma .kp, .chroma .no, .chroma .nv, .chroma .vc,
        .chroma .vg, .chroma .vi, .chroma .vm, .chroma .py, .chroma .na,
        .chroma .ld, .chroma .sa, .chroma .sb, .chroma .sc, .chroma .dl,
        .chroma .sd, .chroma .s2, .chroma .se, .chroma .sh, .chroma .si,
        .chroma .sx, .chroma .sr, .chroma .s1, .chroma .ss {
            color: #79c0ff
        }

        .chroma .nl {
            color: #79c0ff;
            font-weight: bold
        }

        .chroma .nc, .chroma .ne {
            color: #f0883e
        }

        .chroma .nd, .chroma .nf, .chroma .fm {
            color: #d2a8ff
        }

        .chroma .nb, .chroma .ni {
            color: #ffa657
        }

        .chroma .nt {
            color: #7ee787
        }

        .chroma .nx, .chroma .p {
            color: #e6edf3
        }

        .chroma .bp, .chroma .go, .chroma .gp {
            color: #8b949e
        }

        .chroma .l, .chroma .s, .chroma .m, .chroma .mb, .chroma .mf,
        .chroma .mh, .chroma .mi, .chroma .il, .chroma .mo {
            color: #a5d6ff
        }

        .chroma .c, .chroma .ch, .chroma .cm, .chroma .c1, .chroma .cs, .chroma .cp, .chroma .cpf {
            color: #8b949e
        }

        .chroma .gd {
            color: #ffa198;
            background-color: #490202
        }

        .chroma .gi {
            color: #56d364;
            background-color: #0f5323
        }

        .chroma .ge {
            color: #e6edf3;
            font-style: italic
        }

        .chroma .gr {
            color: #ffa198
        }

        .chroma .gh, .chroma .gu {
            color: #79c0ff
        }

        .chroma .gt {
            color: #ff7b72
        }

        .chroma .gs {
            font-weight: bold
        }

        .chroma .gl {
            text-decoration: underline
        }

        .chroma .w {
            color: #6e7681
        }
    }

    /* wide display math scrolls instead of overflowing the column */
    mjx-container[display="true"] {
        overflow-x: auto;
        overflow-y: hidden
    }

    /* function-plot axis titles follow the text color */
    svg text.x.axis-label, svg text.y.axis-label, svg text.top-right-legend {
        fill: var(--fontcolor)
    }

    /* jspreadsheet tables follow the color scheme */
    .jss_spreadsheet .jss_worksheet {
        font-size: 16px
    }

    @media (prefers-color-scheme: dark) {
        .jss_spreadsheet {
            color: var(--fontcolor)
        }

        .jss_spreadsheet .jss_worksheet {
            background-color: var(--prebgcolor);
            color: var(--fontcolor)
        }

        .jss_spreadsheet .jss_worksheet td {
            background-color: transparent;
            color: var(--fontcolor);
            border-color: var(--prebordercolor)
        }

        .jss_spreadsheet .jss_worksheet thead td,
        .jss_spreadsheet .jss_worksheet td.jss_row,
        .jss_spreadsheet .jss_worksheet td.jss_selectall {
            background-color: var(--codebgcolor);
            color: var(--mutedcolor)
        }
    }

    /* jspreadsheet clipboard helper: hidden, but keep it focusable */
    textarea.jss_textarea {
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: 0;
        border: 0;
        background: transparent;
        opacity: 0;
        resize: none
    }

    /* jump-to anchors get a subtle flash */
    :target {
        animation: target-flash 2s ease-out
    }

    @keyframes target-flash {
        from {
            background-color: var(--codebgcolor)
        }
    }

    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--fontcolor);
        outline-offset: 2px
    }

    @media (prefers-reduced-motion: reduce) {
        :target {
            animation: none
        }
    }
</style>
